[metadata]
name = "agent-jitter-study"
version = "1.0.0"
description = "Agent check-in jitter and sleep implementation study - portable GUI toolkit"
requires-python = ">=3.11"
license = "Proprietary study tool"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "S", "N"]
ignore = ["S101"]  # asserts allowed in tests/lib validation

[tool.mypy]
strict = true
python_version = "3.11"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"