name: BurpTester CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew build --no-daemon
        name: Unit tests + build

  sast:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew :burp-extension:spotbugsMain --no-daemon
        name: SAST (SpotBugs)

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - run: ./gradlew cyclonedxBom --no-daemon
      - name: OSV scan
        uses: google/osv-scanner-action@v1.0.1
        with: { scan-args: '--sbom=build/reports/bom.json' }
      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: cyclonedx-sbom
          path: build/reports/bom.json

  e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v3
      - name: Start vulnerable JWT fixture
        run: |
          python3 vuln-app/server.py 8765 &
          sleep 3
      - name: Engine E2E against fixture (detects alg=none)
        env:
          BURPTESTER_E2E: "1"
          BURPTESTER_E2E_URL: http://127.0.0.1:8765/resource
        run: ./gradlew :burp-extension:test --no-daemon
        name: Engine E2E against internal fixture

  sign-and-release:
    runs-on: windows-latest
    needs: [sast, sbom, e2e]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '24' }
      - name: Build portable image
        run: >
          .\gradlew.bat :gui-launcher:packagePortable --no-daemon
      - name: Sign EXE (HSM cert via secret)
        run: |
          [IO.File]::WriteAllBytes("$env:RUNNER_TEMP\release.pfx", [Convert]::FromBase64String($env:CERT_BASE64))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe | Sort-Object FullName -Descending | Select-Object -First 1
          & $signtool.FullName sign /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /f "$env:RUNNER_TEMP\release.pfx" /p "$env:PFX_PASSWORD" gui-launcher\build\portable\BurpTester\BurpTester.exe
        env:
          PFX_PASSWORD: ${{ secrets.PFX_PASSWORD }}
          CERT_BASE64: ${{ secrets.CERT_BASE64 }}
      - name: Upload release assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            gui-launcher/build/portable/BurpTester/BurpTester.exe
            gui-launcher/build/BurpTester-portable.zip
            build/reports/bom.json