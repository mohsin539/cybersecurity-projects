# Shared CI workflow: lint -> SAST -> SCA -> unit tests -> container image.
# Mirrors the pipeline a release candidate must pass before promotion
# (ISO 27001 A.12.4/A.14.2, NIST SA-11, OWASP ASVS V14).

name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  quality:
    name: Lint / SAST / SCA / Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check app tests

      - name: SAST (bandit, non-zero on high confidence)
        run: bandit -r app -q -lll

      - name: SCA / dependency vulnerabilities (pip-audit)
        run: pip-audit -r requirements.txt

      - name: Unit + integration tests
        run: pytest -q

  image:
    name: Build / container scan
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f backend/Dockerfile -t xtester:${{ github.sha }} .

      - name: Scan container with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: xtester:${{ github.sha }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL

      - name: Upload scan results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

  smoke:
    name: Docker compose smoke test
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Copy env
        run: |
          cp .env.example .env
          # randomize bootstrap secrets for CI only
          python - <<'PY'
          import secrets, pathlib
          p = pathlib.Path(".env")
          t = p.read_text()
          t = t.replace("SECRET_KEY=change-me-generate-with-secrets-token-urlsafe", f"SECRET_KEY={secrets.token_urlsafe(48)}")
          t = t.replace("BOOTSTRAP_ADMIN_PASSWORD=change-me-strong-password", f"BOOTSTRAP_ADMIN_PASSWORD={secrets.token_urlsafe(18)}C!a")
          p.write_text(t)
          PY

      - name: Boot stack
        run: docker compose up -d --build --wait --wait-timeout 300

      - name: Health check
        run: |
          curl -fsS http://127.0.0.1:8000/health

      - name: Trigger a real scan against the vuln lab (smoke)
        run: |
          TOKEN=$(curl -fsS -X POST http://127.0.0.1:8000/api/auth/login \
            -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$(grep BOOTSTRAP_ADMIN_PASSWORD .env | cut -d= -f2)\"}" | python -c 'import sys,json;print(json.load(sys.stdin)["access_token"])')
          SCAN=$(curl -fsS -X POST http://127.0.0.1:8000/api/scans \
            -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
            -d '{"url":"http://lab:5001/html?name=hello","context":"auto"}')
          echo "$SCAN"

      - name: Teardown
        run: docker compose down -v