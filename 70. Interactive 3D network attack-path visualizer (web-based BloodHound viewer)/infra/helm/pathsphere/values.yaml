replicaCount: 1

image:
  repository: ghcr.io/pathsphere-3d
  pullPolicy: IfNotPresent
  tag: "0.1.0"

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  hosts:
    - host: pathsphere.example.com
      paths:
        - path: /
          pathType: Prefix

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

securityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault

networkPolicy:
  enabled: true
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              tier: data

env:
  - name: LOG_LEVEL
    value: info
  - name: OPENTELEMETRY_COLLECTOR
    value: otel-collector.monitoring.svc:4317