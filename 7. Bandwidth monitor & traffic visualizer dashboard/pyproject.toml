[project]
name = "bandwidth-monitor-dashboard"
version = "1.0.0"
description = "Real-time bandwidth monitoring and traffic visualization dashboard"
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
markers = [
    "e2e: end-to-end browser tests (requires playwright + chromium)",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["E501"]