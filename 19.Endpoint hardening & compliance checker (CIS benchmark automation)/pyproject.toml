[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cisguard"
version = "0.1.0"
description = "Portable Windows GUI endpoint hardening & CIS Benchmark compliance checker (read-only assessment)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6,<7",
    "cryptography>=42",
    "structlog>=24",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.6"]

[project.scripts]
cisguard = "cisguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
